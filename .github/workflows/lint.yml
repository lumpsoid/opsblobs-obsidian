name: Node.js build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
              # Lint is advisory during the P2P→server pivot: build and test gate CI,
              # while lint findings that remain live only in files scheduled for rewrite
              # (main/settings-tab/pairing-modal — P4; diff3/conflict-modal — P1) or
              # deletion (sync-server — P5). Flip back to blocking as each phase cleans
              # its files. See docs/implementation-plan.md Phase 0.5.
            - run: npm run lint
              continue-on-error: true
            - run: npm test

